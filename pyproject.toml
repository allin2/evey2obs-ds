[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evey2obs-ds"
version = "0.1.0"
description = "Unified multi-source content extraction and Obsidian knowledge export"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "QLYF" },
]
dependencies = [
    "httpx>=0.28,<1",
    "openai-whisper>=20240930",
    "yt-dlp",
    "beautifulsoup4>=4.12,<5",
    "keyring>=25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]
package = [
  "pyinstaller>=6.0",
]

[project.scripts]
evey2obs = "evey2obs.cli:main"
evey2obs-gui = "evey2obs.cli:_cmd_gui"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/evey2obs/gui/app.py" = ["E501"]
